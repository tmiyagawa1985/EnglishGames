<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Vocab Millionaire - 300 Words Quest</title>
    <style>
        /* 基本レイアウト */
        body { 
            font-family: 'Hiragino Kaku Gothic ProN', sans-serif; 
            background-color: #050a14; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
            color: white; 
        }

        #game-container { 
            text-align: center; 
            /* 画面全体を使えるように幅を100%に */
            width: 100vw; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; 
            z-index: 10;
        }

        /* スクリーン共通設定（全画面・巨大背景） */
        .screen { 
            display: none; 
            width: 100%;
            height: 100%;
            display: none; /* 初期状態 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            
            /* ★ここが重要：背景画像を画面いっぱいに広げる（今の3倍以上の迫力になります） */
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            
            /* 文字を見やすくするため、画像の上に暗いフィルターを重ねる */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('title-bg.png');
        }

        /* JavaScriptでactiveが付いた時だけFlex表示にする */
        .screen.active { 
            display: flex; 
        }

        /* クイズ画面はBGMのリズムに集中するため、少し透過度を下げた黒背景を重ねる */
        #quiz-screen {
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('title-bg.png');
        }

        h1 { 
            color: #fbbf24; 
            font-size: 3.5rem; /* タイトルを巨大化 */
            margin-bottom: 2rem; 
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.9);
            letter-spacing: 8px;
            font-weight: 900;
        }

        #question { 
            font-size: 5rem; /* 問題文を巨大化 */
            margin: 1.5rem 0; 
            color: #fff; 
            font-weight: bold; 
            min-height: 200px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-shadow: 0 0 20px rgba(255,255,255,0.7);
        }
        
        .btn-group { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            max-width: 900px;
        }
        
        /* ボタンも巨大化 */
        .num-btn, .level-btn { 
            background: rgba(13, 30, 58, 0.9); 
            color: #fbbf24; 
            padding: 25px 40px; 
            min-width: 200px; 
            border-radius: 10px; 
            font-size: 1.8rem; 
            border: 3px solid #fbbf24; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: bold; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .level-btn:hover, .num-btn:hover { 
            background: #fbbf24; 
            color: #0d1e3a; 
            box-shadow: 0 0 40px #fbbf24;
            transform: scale(1.1);
        }

        .choice-btn { 
            width: 100%; 
            max-width: 700px;
            margin: 15px 0; 
            padding: 25px; 
            font-size: 2rem; 
            border-radius: 60px; 
            background: rgba(255,255,255,0.05); 
            color: #fff; 
            border: 2px solid #58a6ff; 
            cursor: pointer; 
            font-weight: bold; 
            transition: 0.3s; 
            backdrop-filter: blur(5px);
        }

        #result-score { font-size: 5rem; color: #fbbf24; font-weight: bold; text-shadow: 0 0 20px #fbbf24; }

        /* 火花エフェクト用 */
        .sparkle { position: absolute; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; animation: sparkle-anim 0.6s forwards; z-index: 100; }
        @keyframes sparkle-anim { 0% { transform: scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.5) translate(var(--dx), var(--dy)); opacity: 0; } }
    </style>
</head>
<body>

<audio id="game-bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div id="game-container">
    <div id="load-screen" class="screen active"><h1>Loading Data...</h1></div>

    <div id="level-screen" class="screen">
        <h1>Select Difficulty</h1>
        <div class="btn-group">
            <button class="level-btn easy" onclick="selectLevel('easy')">Easy</button>
            <button class="level-btn normal" onclick="selectLevel('normal')">Normal</button>
            <button class="level-btn hard" onclick="selectLevel('hard')">Hard</button>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>Select Questions</h1>
        <div id="num-options" class="btn-group">
            <button class="num-btn" onclick="startGame(10)">10</button>
            <button class="num-btn" onclick="startGame(20)">20</button>
            <button class="num-btn" onclick="startGame(30)">30</button>
            <button class="num-btn" onclick="startGame(40)">40</button>
            <button class="num-btn" onclick="startGame(50)">50</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="progress" style="color:#fbbf24; font-weight:bold; font-size: 1.2rem;"></div>
        <div id="question"></div>
        <div id="choices"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1>Congratulations!</h1>
        <div id="result-score">0</div>
        <button class="level-btn" style="width:220px" onclick="location.reload()">RETRY</button>
    </div>
</div>

<script>
    let masterWordList = [];
    let filteredList = [];
    let gameList = [];
    let currentIdx = 0;
    let score = 0;
    let audioCtx = null;
    const bgm = document.getElementById('game-bgm');

    // データ読み込み
    async function fetchWords() {
        try {
            const response = await fetch('words.json');
            if (!response.ok) throw new Error('Network Error');
            masterWordList = await response.json();
            showScreen('level-screen');
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('load-screen').innerHTML = `<h1 style="color:red">Loading Error</h1>`;
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function unlockAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // ドーパミン刺激音（決定音）
    function playSelectSound() {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.2);
    }

    function selectLevel(level) {
        playSelectSound();
        filteredList = masterWordList.filter(w => w.level === level);
        if (filteredList.length === 0) filteredList = masterWordList;
        showScreen('start-screen');
    }

    function startGame(num) {
        playSelectSound();
        bgm.volume = 0.4;
        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("BGM Play Error:", e));

        gameList = [...filteredList].sort(() => Math.random() - 0.5).slice(0, num);
        currentIdx = 0; score = 0;
        showScreen('quiz-screen');
        loadQuiz();
    }

    function loadQuiz() {
        const quiz = gameList[currentIdx];
        document.getElementById("progress").innerText = `LV: ${currentIdx + 1} / ${gameList.length}`;
        document.getElementById("question").innerText = quiz.j;
        const choicesDiv = document.getElementById("choices");
        choicesDiv.innerHTML = "";

        let wrongs = masterWordList.filter(w => w.e !== quiz.e).sort(() => Math.random() - 0.5).slice(0, 3).map(w => w.e);
        let all = [...wrongs, quiz.e].sort(() => Math.random() - 0.5);

        all.forEach(c => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = c;
            btn.onclick = () => checkAnswer(c, quiz.e);
            choicesDiv.appendChild(btn);
        });
    }

    function checkAnswer(s, c) {
        if (s === c) {
            score++;
            playCorrectFanfare();
            createSpark();
        }
        currentIdx++;
        if (currentIdx < gameList.length) setTimeout(loadQuiz, 600);
        else showResult();
    }

    function playCorrectFanfare() {
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + (i * 0.05));
            g.gain.setValueAtTime(0.1, now + (i * 0.05));
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now + (i * 0.05)); o.stop(now + 0.4);
        });
    }

    function createSpark() {
        const container = document.getElementById("game-container");
        for (let i = 0; i < 20; i++) {
            const s = document.createElement("div");
            s.className = "sparkle";
            s.style.left = "50%"; s.style.top = "50%";
            s.style.background = "#fbbf24";
            s.style.setProperty('--dx', `${(Math.random()-0.5)*400}px`);
            s.style.setProperty('--dy', `${(Math.random()-0.5)*400}px`);
            container.appendChild(s);
            setTimeout(() => s.remove(), 600);
        }
    }

    function showResult() {
        showScreen('result-screen');
        document.getElementById("result-score").innerText = `${score} / ${gameList.length}`;
    }

    fetchWords();
</script>
</body>
</html>
