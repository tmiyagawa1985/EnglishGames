<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Pop English 300! Millionaire Level Edition</title>
    <style>
        body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background-color: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; color: white; }
        #game-container { background: #161b22; padding: 2rem; border-radius: 30px; box-shadow: 0 0 50px rgba(0,210,255,0.3); text-align: center; width: 450px; border: 4px solid #3081f7; position: relative; }
        .screen { display: none; }
        .active { display: block; }
        h1 { color: #58a6ff; font-size: 1.5rem; margin-bottom: 2rem; text-shadow: 0 0 10px #3081f7; }
        #question { font-size: 3.2rem; margin: 1rem 0; color: #fff; font-weight: bold; min-height: 140px; display: flex; align-items: center; justify-content: center; }
        
        .btn-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .num-btn, .level-btn { background: linear-gradient(180deg, #1e3a8a, #0d1e3a); color: #fbbf24; padding: 15px; width: 120px; border-radius: 10px; font-size: 1.2rem; border: 2px solid #fbbf24; cursor:pointer; transition: all 0.2s; font-weight: bold; }
        .num-btn { width: 85px; }
        .level-btn:hover, .num-btn:hover { background: #fbbf24; color: #1e3a8a; transform: scale(1.05); }

        .easy { border-color: #4caf50; color: #4caf50; }
        .normal { border-color: #ffeb3b; color: #ffeb3b; }
        .hard { border-color: #f44336; color: #f44336; }

        .choice-btn { display: block; width: 100%; margin: 12px 0; padding: 18px; font-size: 1.4rem; border-radius: 10px; background: transparent; color: #fff; border: 2px solid #58a6ff; cursor:pointer; font-weight:bold; transition: 0.2s; }
        .choice-btn:hover { background: rgba(88, 166, 255, 0.2); border-color: #fbbf24; color: #fbbf24; }
        #result-score { font-size: 5rem; color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>

<audio id="game-bgm" loop><source src="Millionare.mp3" type="audio/mpeg"></audio>

<div id="game-container">
    <div id="load-screen" class="active"><h1>Loading Data...</h1></div>

    <div id="level-screen" class="screen">
        <h1>Select Difficulty</h1>
        <div class="btn-group">
            <button class="level-btn easy" onclick="selectLevel('easy')">Easy</button>
            <button class="level-btn normal" onclick="selectLevel('normal')">Normal</button>
            <button class="level-btn hard" onclick="selectLevel('hard')">Hard</button>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>Select Questions</h1>
        <div id="num-options" class="btn-group">
            <button class="num-btn" onclick="startGame(10)">10</button>
            <button class="num-btn" onclick="startGame(20)">20</button>
            <button class="num-btn" onclick="startGame(30)">30</button>
            <button class="num-btn" onclick="startGame(40)">40</button>
            <button class="num-btn" onclick="startGame(50)">50</button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div id="progress" style="color:#fbbf24; font-weight:bold;"></div>
        <div id="question"></div>
        <div id="choices"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1>Congratulations!</h1>
        <div id="result-score">0</div>
        <button class="level-btn" style="width:220px" onclick="location.reload()">RETRY</button>
    </div>
</div>

<script>
    let masterWordList = [];
    let filteredList = [];
    let gameList = [];
    let currentIdx = 0;
    let score = 0;
    let audioCtx = null;
    const bgm = document.getElementById('game-bgm');

    // データ読み込み
    async function fetchWords() {
        try {
            const response = await fetch('300words.json');
            masterWordList = await response.json();
            document.getElementById('load-screen').classList.remove('active');
            document.getElementById('level-screen').classList.add('active');
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // オーディオの初期化と一時停止解除
    function resumeAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // ドーパミンを刺激する「決定音」生成
    function playSelectSound() {
        resumeAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
        
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(now + 0.2);
    }

    // 難易度選択
    function selectLevel(level) {
        // ここでブラウザのオーディオロックを解除
        resumeAudio();
        playSelectSound();

        filteredList = masterWordList.filter(w => w.level === level);
        if (filteredList.length === 0) filteredList = masterWordList;

        document.getElementById('level-screen').classList.remove('active');
        document.getElementById('start-screen').classList.add('active');
    }

    // ゲーム開始（BGMスタート）
    function startGame(num) {
        resumeAudio();
        playSelectSound();

        bgm.volume = 0.3;
        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("BGM Play Error:", e));

        gameList = [...filteredList].sort(() => Math.random() - 0.5).slice(0, num);
        currentIdx = 0; 
        score = 0;

        document.getElementById("start-screen").classList.remove("active");
        document.getElementById("quiz-screen").classList.add("active");
        loadQuiz();
    }

    function loadQuiz() {
        const quiz = gameList[currentIdx];
        document.getElementById("progress").innerText = `Level: ${currentIdx + 1} / ${gameList.length}`;
        document.getElementById("question").innerText = quiz.j;
        const choicesDiv = document.getElementById("choices");
        choicesDiv.innerHTML = "";

        // 不正解のダミー選択肢（masterWordList全体から抽出）
        let wrongs = masterWordList
            .filter(w => w.e !== quiz.e)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(w => w.e);
        
        let all = [...wrongs, quiz.e].sort(() => Math.random() - 0.5);

        all.forEach(c => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = c;
            btn.onclick = () => checkAnswer(c, quiz.e);
            choicesDiv.appendChild(btn);
        });
    }

    function checkAnswer(s, c) {
        if (s === c) {
            score++;
            playCorrectFanfare();
        }
        currentIdx++;
        if (currentIdx < gameList.length) {
            setTimeout(loadQuiz, 600);
        } else {
            showResult();
        }
    }

    function playCorrectFanfare() {
        resumeAudio();
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, now + (i * 0.04));
            g.gain.setValueAtTime(0.1, now + (i * 0.04));
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now + (i * 0.04)); o.stop(now + 0.5);
        });
    }

    function showResult() {
        document.getElementById("quiz-screen").classList.remove("active");
        document.getElementById("result-screen").classList.add("active");
        document.getElementById("result-score").innerText = `${score} / ${gameList.length}`;
    }

    fetchWords();
</script>
</body>
</html>
